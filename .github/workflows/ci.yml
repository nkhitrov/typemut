name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly recheck of every cached kill (`--refresh`, with a longer time limit
  # than other runs), stored like a push to main.
  schedule:
    - cron: "0 3 * * 1"
  # A manual run with `refresh` re-triggers a refresh that was replaced in the
  # concurrency queue (see below).
  workflow_dispatch:
    inputs:
      refresh:
        description: Recheck every cached kill (--refresh, 5.5-hour limit)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: make install

      - name: Run tests
        run: make test

      - name: Run linters
        run: make lint

  typemut:
    runs-on: ubuntu-latest
    # max-duration (25 min) < timeout-minutes (35 min) < job timeout (45 min):
    # typemut stops starting mutants, saves the finished ones, and the database
    # is still uploaded. The weekly --refresh gets 5.5 h < 340 min < 350 min,
    # since a refresh rechecks only the mutants that fit in its max-duration.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.refresh) && 350 || 45 }}
    # Runs of one ref wait for each other, so every run on main downloads the
    # database the previous one uploaded, not one an older run uploads later.
    # GitHub keeps one waiting run per group: a newer one cancels it. For a
    # push that is harmless (the newer run covers it), but a waiting refresh
    # can be cancelled by a push: re-run it by hand with `refresh`. A separate
    # group for refreshes would be worse: a push during the refresh would
    # upload a newer run's database built without the refresh's results.
    concurrency:
      group: typemut-db-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # find and download the database artifact of main

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install
        run: make install

      # The action (action.yml at the root, run from this checkout): every run,
      # main included, starts from the database of the newest run on main of
      # this repository, whatever its outcome (no database: a full run), and
      # only push, schedule and workflow_dispatch runs on main store it, even
      # when typemut failed. The same as `make mutate MUTATE_ARGS=...`.
      - name: Mutation-test own type annotations
        uses: ./
        with:
          command: uv run typemut
          jobs: 4
          baseline: typemut-baseline.json
          refresh: ${{ (github.event_name == 'schedule' || inputs.refresh) && 'true' || 'false' }}
          max-duration: ${{ (github.event_name == 'schedule' || inputs.refresh) && 19800 || 1500 }}
          timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.refresh) && 340 || 35 }}

      - name: Build HTML report
        if: always()
        run: uv run typemut html -o typemut-report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typemut-report
          path: typemut-report.html
          overwrite: true
